name: Release

# Push a tag like v0.3.0 (matching desktop/package.json) to build the Windows installer, the macOS DMG/ZIP and the
# Linux AppImage on their native runners and publish them as a GitHub Release with docs/release-notes/<tag>.md.
# The latest*.yml files and .blockmaps are what the in-app updater (desktop/src/updater.ts) reads from the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            rid: win-x64
            target: --win nsis --x64
            artifact: release-windows
          - name: macOS DMG (Apple silicon)
            os: macos-latest
            rid: osx-arm64
            # ad-hoc signature: Apple silicon refuses to launch an unsigned app (the updater then only announces releases)
            target: --mac dmg zip --arm64 -c.mac.identity=-
            artifact: release-macos
          - name: Linux AppImage
            os: ubuntu-latest
            rid: linux-x64
            target: --linux AppImage --x64
            artifact: release-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - name: Check tag matches desktop/package.json
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "::error::Tag $TAG does not match desktop/package.json ($v)"; exit 1; fi
          node .github/scripts/check-versions.mjs
          test -f "docs/release-notes/$TAG.md" || { echo "::error::docs/release-notes/$TAG.md is missing"; exit 1; }

      - name: Publish the engine (${{ matrix.rid }})
        run: dotnet publish engine/src/Kod.Engine/Kod.Engine.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o engine/publish
      - name: Build the UI
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
      - name: Build the desktop shell
        run: |
          npm ci --prefix desktop
          npm --prefix desktop run build
      - name: Package
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      # Every platform must ship its update metadata, or installed copies on it never see this release.
      - name: Check update metadata against the release assets
        run: node .github/scripts/check-update-info.mjs artifacts --tag "$TAG" --require latest.yml,latest-mac.yml,latest-linux.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kod ${{ env.TAG }}
          body_path: docs/release-notes/${{ env.TAG }}.md
          files: artifacts/*
          fail_on_unmatched_files: true
